
name: FlyWise CI

# Run the workflow whenever code is pushed or a pull request is created
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Check Python Application
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask pandas numpy scikit-learn joblib

      # Step 4: Check Python syntax
      - name: Check Python files
        run: |
          python -m compileall -q website notebooks check_class_accuracy.py

